name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "NetBird tag to release (e.g. v0.82.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      flags: ""
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build.sh counts commits touching install.sh

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Determine release tag
        id: reltag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build distribution files
        run: |
          bash build.sh ${{ steps.reltag.outputs.tag }}

      - name: Create GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.reltag.outputs.tag }} \
             --repo ${{ github.repository }} \
             --title "${{ steps.reltag.outputs.tag }}" \
             --notes "Automated release for tag ${{ steps.reltag.outputs.tag }}" \
             ./dist/*                                                          
